<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <title>Google Search - University LMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #ffffff;
      color: #202124;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .search-container {
      width: 100%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: -60px;
    }

    /* Google Brand Logo */
    .google-logo {
      margin-bottom: 26px;
      user-select: none;
    }

    .google-logo svg {
      width: 272px;
      height: 92px;
    }

    /* Search Input Bar */
    .search-form {
      width: 100%;
    }

    .search-box {
      width: 100%;
      height: 48px;
      background: #ffffff;
      border: 1px solid #dfe1e5;
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.12);
      transition: all 0.2s ease;
      direction: rtl;
    }

    .search-box:hover, .search-box:focus-within {
      box-shadow: 0 2px 10px rgba(32, 33, 36, 0.2);
      border-color: rgba(223, 225, 229, 0);
    }

    .search-icon {
      color: #9aa0a6;
      display: flex;
      align-items: center;
      margin-left: 12px;
      flex-shrink: 0;
    }

    .search-icon svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .search-input {
      flex: 1;
      height: 100%;
      border: none;
      outline: none;
      font-size: 16px;
      font-family: 'Vazirmatn', 'Inter', sans-serif;
      color: #202124;
      background: transparent;
    }

    .search-input::placeholder {
      color: #80868b;
      font-size: 14.5px;
    }

    /* Buttons */
    .buttons-row {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .btn-google {
      background-color: #f8f9fa;
      border: 1px solid #f8f9fa;
      border-radius: 6px;
      color: #3c4043;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      padding: 0 18px;
      height: 38px;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s;
    }

    .btn-google:hover {
      box-shadow: 0 1px 2px rgba(60, 64, 67, 0.2);
      background-color: #f1f3f4;
      border-color: #dadce0;
      color: #202124;
    }

    .tip-text {
      margin-top: 28px;
      font-size: 13px;
      color: #70757a;
      text-align: center;
      line-height: 1.6;
      max-width: 480px;
    }

    .tip-text strong {
      color: #1a73e8;
    }
  </style>
</head>
<body>

  <div class="search-container">
    <!-- Google Logo -->
    <div class="google-logo">
      <svg viewBox="0 0 272 92" width="272" height="92">
        <path fill="#EA4335" d="M115.75 47.18c0 12.77-9.99 22.18-22.25 22.18s-22.25-9.41-22.25-22.18C71.25 34.32 81.24 25 93.5 25s22.25 9.32 22.25 22.18zm-9.74 0c0-7.98-5.79-13.44-12.51-13.44S80.99 39.2 80.99 47.18c0 7.9 5.79 13.44 12.51 13.44s12.51-5.55 12.51-13.44z"/>
        <path fill="#FBBC05" d="M163.75 47.18c0 12.77-9.99 22.18-22.25 22.18s-22.25-9.41-22.25-22.18c0-12.85 9.99-22.18 22.25-22.18s22.25 9.32 22.25 22.18zm-9.74 0c0-7.98-5.79-13.44-12.51-13.44s-12.51 5.46-12.51 13.44c0 7.9 5.79 13.44 12.51 13.44s12.51-5.55 12.51-13.44z"/>
        <path fill="#4285F4" d="M209.75 26.34v39.82c0 16.38-9.66 23.07-21.08 23.07-10.75 0-17.22-7.19-19.66-13.07l8.48-3.53c1.51 3.61 5.21 8.16 11.18 8.16 7.31 0 11.84-4.53 11.84-13.07v-3.19h-.34c-2.18 2.69-6.38 5.04-11.68 5.04-11.09 0-21.25-9.66-21.25-22.09 0-12.52 10.16-22.26 21.25-22.26 5.29 0 9.49 2.35 11.68 4.96h.34v-3.86h9.94zm-9.15 21.09c0-7.81-5.21-13.44-11.93-13.44-6.8 0-12.51 5.63-12.51 13.44 0 7.72 5.71 13.19 12.51 13.19 6.72 0 11.93-5.47 11.93-13.19z"/>
        <path fill="#34A853" d="M225 3v65h-9.5V3h9.5z"/>
        <path fill="#EA4335" d="M262.02 54.48l7.56 5.04c-2.44 3.61-8.32 9.83-18.48 9.83-12.6 0-22.01-9.74-22.01-22.18 0-13.19 9.49-22.18 20.92-22.18 11.51 0 17.14 9.16 18.98 14.11l1.01 2.52-29.65 12.28c2.27 4.45 5.8 6.72 10.75 6.72 4.96 0 8.4-2.44 10.92-6.14zm-13.86-8.23l19.82-8.23c-1.09-2.77-4.37-4.7-8.23-4.7-4.95 0-11.84 4.37-11.59 12.93z"/>
        <path fill="#4285F4" d="M35.29 41.41V32H67c.31 1.64.47 3.58.47 5.68 0 7.06-1.93 15.79-8.15 22.01-6.05 6.3-13.78 9.66-24.02 9.66C16.32 69.35.36 53.89.36 34.85.36 15.81 16.32.35 35.3.35c10.42 0 17.72 4.09 23.27 9.38L52 26.19C47.88 22.33 42.43 19.3 35.3 19.3c-13.52 0-24.44 10.93-24.44 24.45 0 13.53 10.92 24.45 24.44 24.45 8.74 0 13.69-3.53 16.89-6.72 2.77-2.77 4.54-6.72 5.21-12.18H35.29v-7.89z"/>
      </svg>
    </div>

    <!-- Search Box -->
    <form id="google-search-form" class="search-form">
      <div class="search-box">
        <div class="search-icon">
          <svg viewBox="0 0 24 24">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
        </div>
        <input 
          type="text" 
          id="query-input" 
          class="search-input" 
          placeholder="Search for your university portal, LMS, or Moodle..." 
          autocomplete="off" 
          autofocus
          required 
        />
      </div>

      <div class="buttons-row" style="justify-content: center;">
        <button type="submit" class="btn-google">Google Search</button>
        <button type="button" id="btn-goto-google" class="btn-google">Go to Google Homepage</button>
      </div>
    </form>

    <div class="tip-text">
      Search for your university portal (e.g. <strong>Moodle</strong>, <strong>Canvas</strong>, or <strong>Blackboard</strong>) and sign in. Open the recorded session to start downloading.
    </div>
  </div>

  <script>
    const form = document.getElementById('google-search-form');
    const input = document.getElementById('query-input');
    const btnGotoGoogle = document.getElementById('btn-goto-google');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = input.value.trim();
      if (!val) return;
      if (/^https?:\/\//i.test(val) || (/^[a-z0-9-]+(\.[a-z0-9-]+)+/i.test(val) && !val.includes(' '))) {
        let url = val;
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
          url = 'https://' + url;
        }
        window.location.href = url;
      } else {
        window.location.href = `https://www.google.com/search?q=${encodeURIComponent(val)}`;
      }
    });

    btnGotoGoogle.addEventListener('click', () => {
      window.location.href = 'https://www.google.com';
    });
  </script>
</body>
</html>
